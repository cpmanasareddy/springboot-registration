apiVersion: apps/v1
kind: Deployment
metadata:
  name: experiment12-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: experiment12
  template:
    metadata:
      labels:
        app: experiment12
    spec:
      containers:
        - name: springboot-app
          image: exp12:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
